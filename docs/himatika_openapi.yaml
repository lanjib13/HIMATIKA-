    post:
      tags: [Galeri]
      summary: Menambahkan foto galeri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaleriInput'
      responses:
        '201':
          description: Foto galeri berhasil ditambahkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Galeri'
        '401':
