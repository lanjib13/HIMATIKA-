          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Galeri'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Galeri]
      summary: Memperbarui informasi galeri
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GaleriInput'
      responses:
        '200':
          description: Galeri berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
