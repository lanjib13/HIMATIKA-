                        $ref: '#/components/schemas/Berita'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Berita]
      summary: Memperbarui berita atau event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BeritaInput'
      responses:
        '200':
          description: Berita berhasil diperbarui
          content:
