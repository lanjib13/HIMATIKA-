      tags: [Struktur Organisasi]
      summary: Menambahkan jabatan pada struktur organisasi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StrukturInput'
      responses:
        '201':
          description: Struktur berhasil ditambahkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
