        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Divisi]
      summary: Mendapatkan detail divisi
      security: []
      responses:
        '200':
          description: Detail divisi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Divisi'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Divisi]
      summary: Memperbarui divisi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DivisiInput'
      responses:
        '200':
          description: Divisi berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Divisi'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Divisi]
      summary: Menghapus divisi
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /anggota:
