  /berita:
    get:
      tags: [Berita]
      summary: Mendapatkan daftar berita dan event yang terbit
      description: Endpoint publik hanya mengembalikan data dengan status terbit.
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
        - name: kategori
          in: query
          schema:
            type: string
            enum: [berita, event]
        - name: status
          in: query
          description: Filter status hanya berlaku untuk admin.
          schema:
            type: string
            enum: [draf, terbit]
      responses:
        '200':
          $ref: '#/components/responses/PaginatedBerita'
    post:
      tags: [Berita]
      summary: Menambahkan berita atau event
      requestBody:
        required: true
