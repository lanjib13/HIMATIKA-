        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Aspirasi]
      summary: Menghapus aspirasi
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /aspirasi/{id}/status:
    patch:
      tags: [Aspirasi]
      summary: Memperbarui status aspirasi
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int64 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [Baru, Dibaca, Diproses, Selesai]
                  example: Diproses
      responses:
        '200':
          description: Status aspirasi berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Aspirasi'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase Auth access token.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
    Search:
      name: search
      in: query
      schema: { type: string }

  schemas:
    Success:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Data berhasil ditampilkan }
    Error:
      type: object
      properties:
        success: { type: boolean, example: false }
        message: { type: string, example: Terjadi kesalahan }
        errors:
          nullable: true
          oneOf:
            - type: object
            - type: array
              items: {}
            - type: string
    Pagination:
      type: object
      properties:
        page: { type: integer, example: 1 }
        limit: { type: integer, example: 10 }
        total_data: { type: integer, example: 25 }
        total_pages: { type: integer, example: 3 }
    PaginatedResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Data berhasil ditampilkan }
        data:
          type: array
          items:
            type: object
            additionalProperties: true
        pagination:
          $ref: '#/components/schemas/Pagination'
    Admin:
      type: object
      properties:
        user_id: { type: string, format: uuid }
        nama: { type: string, example: Admin HIMATIKA }
        email: { type: string, format: email }
    LoginResponse:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, example: Login berhasil }
        data:
          type: object
          properties:
            access_token: { type: string }
            token_type: { type: string, example: Bearer }
            admin:
              $ref: '#/components/schemas/Admin'

    Profil:
      type: object
      properties:
        id_profil: { type: integer, format: int64 }
        nama_organisasi: { type: string }
        deskripsi: { type: string, nullable: true }
        sejarah: { type: string, nullable: true }
        visi: { type: string, nullable: true }
        misi: { type: string, nullable: true }
        logo: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    ProfilInput:
      type: object
      required: [nama_organisasi]
      properties:
        nama_organisasi: { type: string, maxLength: 150 }
        deskripsi: { type: string, nullable: true }
        sejarah: { type: string, nullable: true }
        visi: { type: string, nullable: true }
        misi: { type: string, nullable: true }
        logo: { type: string, nullable: true }

    Divisi:
      type: object
      properties:
        id_divisi: { type: integer, format: int64 }
        nama_divisi: { type: string }
        deskripsi: { type: string, nullable: true }
        slug: { type: string }
        created_at: { type: string, format: date-time }
    DivisiInput:
      type: object
      required: [nama_divisi, slug]
      properties:
        nama_divisi: { type: string, maxLength: 100 }
        deskripsi: { type: string, nullable: true }
        slug: { type: string, maxLength: 120 }

    Anggota:
      type: object
      properties:
        id_anggota: { type: integer, format: int64 }
        id_divisi: { type: integer, format: int64, nullable: true }
        nama: { type: string }
        nim: { type: string, nullable: true }
        foto: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    AnggotaInput:
      type: object
      required: [nama]
      properties:
        id_divisi: { type: integer, format: int64, nullable: true }
        nama: { type: string, maxLength: 100 }
        nim: { type: string, maxLength: 30, nullable: true }
        foto: { type: string, nullable: true }

    Proker:
      type: object
      properties:
        id_proker: { type: integer, format: int64 }
        id_divisi: { type: integer, format: int64 }
        nama_proker: { type: string }
        deskripsi: { type: string, nullable: true }
        tanggal_mulai: { type: string, format: date, nullable: true }
        tanggal_selesai: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [rencana, berjalan, selesai]
    ProkerInput:
      type: object
      required: [id_divisi, nama_proker]
      properties:
        id_divisi: { type: integer, format: int64 }
        nama_proker: { type: string, maxLength: 150 }
        deskripsi: { type: string, nullable: true }
        tanggal_mulai: { type: string, format: date, nullable: true }
        tanggal_selesai: { type: string, format: date, nullable: true }
        status:
          type: string
          enum: [rencana, berjalan, selesai]
          default: rencana

    Berita:
      type: object
      properties:
        id_berita: { type: integer, format: int64 }
        judul: { type: string }
        slug: { type: string }
        kategori: { type: string, enum: [berita, event] }
        isi: { type: string }
        gambar_sampul: { type: string, nullable: true }
        tanggal: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draf, terbit] }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    BeritaInput:
      type: object
      required: [judul, slug, kategori, isi]
      properties:
        judul: { type: string, maxLength: 200 }
        slug: { type: string, maxLength: 220 }
        kategori: { type: string, enum: [berita, event] }
        isi: { type: string }
        gambar_sampul: { type: string, nullable: true }
        tanggal: { type: string, format: date, nullable: true }
        status: { type: string, enum: [draf, terbit], default: draf }

    Galeri:
      type: object
      properties:
        id_galeri: { type: integer, format: int64 }
        judul: { type: string }
        deskripsi: { type: string, nullable: true }
        gambar: { type: string }
        tanggal_kegiatan: { type: string, format: date, nullable: true }
        created_by: { type: string, format: uuid, nullable: true }
        created_at: { type: string, format: date-time }
    GaleriInput:
      type: object
      required: [judul, gambar]
      properties:
        judul: { type: string, maxLength: 150 }
        deskripsi: { type: string, nullable: true }
        gambar: { type: string }
        tanggal_kegiatan: { type: string, format: date, nullable: true }

    Prestasi:
      type: object
      properties:
        id_prestasi: { type: integer, format: int64 }
        nama_prestasi: { type: string }
        tingkat: { type: string, nullable: true }
        penyelenggara: { type: string, nullable: true }
        tanggal: { type: string, format: date, nullable: true }
        deskripsi: { type: string, nullable: true }
        foto: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    PrestasiInput:
      type: object
      required: [nama_prestasi]
      properties:
        nama_prestasi: { type: string, maxLength: 200 }
        tingkat: { type: string, maxLength: 50, nullable: true }
        penyelenggara: { type: string, maxLength: 150, nullable: true }
        tanggal: { type: string, format: date, nullable: true }
        deskripsi: { type: string, nullable: true }
        foto: { type: string, nullable: true }

    StrukturOrganisasi:
      type: object
      properties:
        id_struktur: { type: integer, format: int64 }
        id_anggota: { type: integer, format: int64 }
        jabatan: { type: string }
        urutan: { type: integer }
        periode: { type: string }
    StrukturInput:
      type: object
      required: [id_anggota, jabatan, periode]
      properties:
        id_anggota: { type: integer, format: int64 }
        jabatan: { type: string, maxLength: 100 }
        urutan: { type: integer, default: 0 }
        periode: { type: string, maxLength: 20, example: '2026/2027' }

    Aspirasi:
      type: object
      properties:
        id_aspirasi: { type: integer, format: int64 }
        nama: { type: string, nullable: true }
        kontak: { type: string, nullable: true }
        kategori: { type: string }
        pesan: { type: string }
        status: { type: string, enum: [Baru, Dibaca, Diproses, Selesai] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    AspirasiInput:
      type: object
      required: [kategori, pesan]
      properties:
        nama: { type: string, maxLength: 100, nullable: true }
        kontak: { type: string, maxLength: 100, nullable: true }
        kategori: { type: string, maxLength: 50 }
        pesan: { type: string, minLength: 5 }

  responses:
    SuccessMessage:
      description: Operasi berhasil
      content:
        application/json:
          schema:
            type: object
            properties:
              success: { type: boolean, example: true }
              message: { type: string, example: Operasi berhasil }
    BadRequest:
      description: Request tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Belum login atau token tidak valid
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Data tidak ditemukan
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ValidationError:
      description: Validasi data gagal
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PaginatedDivisi:
      description: Daftar divisi
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Divisi'
    PaginatedAnggota:
      description: Daftar anggota
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Anggota'
    PaginatedProker:
      description: Daftar program kerja
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Proker'
    PaginatedBerita:
      description: Daftar berita
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Berita'
    PaginatedGaleri:
      description: Daftar galeri
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Galeri'
    PaginatedPrestasi:
      description: Daftar prestasi
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Prestasi'
    PaginatedAspirasi:
      description: Daftar aspirasi
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/PaginatedResponse'
              - type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Aspirasi'
