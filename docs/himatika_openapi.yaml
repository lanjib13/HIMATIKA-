openapi: 3.0.3
info:
  title: HIMATIKA Website API
  description: >-
    REST API untuk website profil dan pusat informasi Himpunan Mahasiswa
    Informatika (HIMATIKA). API mencakup autentikasi admin, pengelolaan konten,
    dashboard, dan aspirasi pengunjung.
  version: 1.0.0
  contact:
    name: Tim Pengembang HIMATIKA

servers:
  - url: http://localhost:5000/api/v1
    description: Development server
  - url: https://api.example.com/api/v1
    description: Production server (ganti dengan URL backend sebenarnya)

tags:
  - name: Authentication
  - name: Dashboard
  - name: Profil
  - name: Divisi
  - name: Anggota
  - name: Program Kerja
  - name: Berita
  - name: Galeri
  - name: Prestasi
  - name: Struktur Organisasi
  - name: Aspirasi

security:
  - BearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Authentication]
      summary: Login admin
      description: Autentikasi admin melalui Supabase Auth.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                  example: admin@himatika.ac.id
                password:
                  type: string
                  format: password
                  example: password123
      responses:
        '200':
          description: Login berhasil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: Logout admin
      responses:
        '200':
          $ref: '#/components/responses/SuccessMessage'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [Authentication]
      summary: Mendapatkan informasi admin yang sedang login
      responses:
        '200':
          description: Informasi admin
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Admin'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Mendapatkan ringkasan dashboard
      responses:
        '200':
          description: Ringkasan jumlah data
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          total_anggota: { type: integer, example: 25 }
                          total_divisi: { type: integer, example: 5 }
                          total_proker: { type: integer, example: 10 }
                          total_berita: { type: integer, example: 15 }
                          total_galeri: { type: integer, example: 30 }
                          total_prestasi: { type: integer, example: 5 }
                          aspirasi_baru: { type: integer, example: 3 }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /profil:
    get:
      tags: [Profil]
      summary: Mendapatkan profil HIMATIKA
      security: []
      responses:
        '200':
          description: Data profil
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profil'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Profil]
      summary: Memperbarui profil HIMATIKA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfilInput'
      responses:
        '200':
          description: Profil berhasil diperbarui
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/Profil'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /divisi:
    get:
      tags: [Divisi]
      summary: Mendapatkan daftar divisi
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Search'
      responses:
        '200':
          $ref: '#/components/responses/PaginatedDivisi'
    post:
      tags: [Divisi]
      summary: Menambahkan divisi
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DivisiInput'
      responses:
        '201':
          description: Divisi berhasil ditambahkan
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
