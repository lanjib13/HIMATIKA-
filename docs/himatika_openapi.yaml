      summary: Mendapatkan struktur organisasi
      security: []
      parameters:
        - name: periode
          in: query
          schema: { type: string, example: '2026/2027' }
      responses:
        '200':
          description: Daftar struktur organisasi
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
