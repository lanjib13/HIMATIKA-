  /aspirasi:
    get:
      tags: [Aspirasi]
      summary: Mendapatkan daftar aspirasi
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Limit'
        - name: status
          in: query
          schema:
            type: string
            enum: [Baru, Dibaca, Diproses, Selesai]
      responses:
        '200':
          $ref: '#/components/responses/PaginatedAspirasi'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Aspirasi]
      summary: Mengirim aspirasi dari pengunjung
      description: Publik dapat mengirim aspirasi tanpa login. Terapkan rate limiting dan validasi spam.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AspirasiInput'
      responses:
        '201':
          description: Aspirasi berhasil dikirim
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Success'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id_aspirasi: { type: integer, format: int64 }
                          status: { type: string, example: Baru }
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Terlalu banyak request

  /aspirasi/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: integer, format: int64 }
    get:
      tags: [Aspirasi]
      summary: Mendapatkan detail aspirasi
      responses:
